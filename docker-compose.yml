services:
  foodie-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: foodie-api
    restart: unless-stopped

    ports:
      - "${API_PORT:-8080}:8080"

    environment:
      APP_ENV: ${APP_ENV}
      APP_VERSION: ${APP_VERSION}
      
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/${MONGO_DATABASE}?authSource=admin

      MINIO_ENDPOINT: ${MINIO_INTERNAL_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_REGION: ${MINIO_REGION}

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - foodie-network

  mongodb:
    image: mongo:8
    container_name: foodie-mongodb
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE}

    ports:
      - "${MONGO_PORT:-27017}:27017"

    volumes:
      - mongodb-data:/data/db

    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_USERNAME}",
          "-p",
          "${MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
      - foodie-network

  minio:
    image: minio/minio:latest
    container_name: foodie-minio
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"

    volumes:
      - minio-data:/data

    networks:
      - foodie-network

volumes:
  mongodb-data:
  minio-data:

networks:
  foodie-network: